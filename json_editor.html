<!DOCTYPE html>
<html>
<head>
    <title>JSON Editor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/json-editor/2.10.0/jsoneditor.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <style>
        body { margin: 20px; }
        .card { border: 1px solid #ddd; padding: 20px; border-radius: 5px; background: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center">JSON Editor</h2>
        <div class="card">
            <div id="editor_holder"></div>
        </div>
        <br>
        <button id="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save JSON</button>
        <button id="download" class="btn btn-success"><i class="fas fa-download"></i> Download JSON</button>
        <input type="file" id="upload" class="btn btn-info" style="display:none;">
        <label for="upload" class="btn btn-warning"><i class="fas fa-upload"></i> Upload JSON</label>
        <pre id="output" class="well"></pre>
    </div>
    
    <script>
        // Define JSON schema for improved UI
        const schema = {
            "title": "ROADMAP JSON Editor",
            "type": "object",
            "properties": {
                "ROADMAP version": { "type": "string" },
                "Model": {
                    "type": "array",
                    "format": "tabs",
                    "items": {
                        "type": "object",
                        "title": "Model Entry",
                        "properties": {
                            "Details": {
                                "type": "object",
                                "title": "Details",
                                "properties": {
                                    "Name": { "type": "string" },
                                    "Content code": { "type": "array", "format": "table", "items": { "type": "string" } },
                                    "RadLex code": { "type": "array", "format": "table", "items": { "type": "string" } },
                                    "Author": { "type": "array", "format": "table", "items": { "type": "object", "properties": { "Name": { "type": "string" }, "Email": { "type": "string" } } } }
                                }
                            },
                            "Use": { "type": "object", "title": "Use Cases", "properties": { "Intended": { "type": "array", "format": "table", "items": { "type": "string" } } } }
                        }
                    }
                }
            }
        };

        // Initialize JSON Editor with better UI
        const editor = new JSONEditor(document.getElementById('editor_holder'), {
            schema: schema,
            theme: 'bootstrap3',
            iconlib: 'fontawesome',
            disable_edit_json: false,
            disable_collapse: false,
            disable_properties: false,
            show_errors: "interaction"
        });

        // Load initial JSON data
        const jsonData = { "ROADMAP version": "2025-01-06", "Model": [ { "Details": { "Name": "Zero-filled Skipped Connection Network (ZSNET)", "Content code": ["AI", "MR"], "RadLex code": ["TOFILL"], "Author": [{ "Name": "Alireza Radmanesh", "Email": "String" }] }, "Use": { "Intended": ["Detection", "Diagnosis"] } } ] };
        editor.setValue(jsonData);

        // Save JSON
        document.getElementById('submit').addEventListener('click', function() {
            document.getElementById('output').textContent = JSON.stringify(editor.getValue(), null, 2);
        });

        // Download JSON
        document.getElementById('download').addEventListener('click', function() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(editor.getValue(), null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "edited_roadmap.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            document.body.removeChild(downloadAnchor);
        });

        // Upload JSON File
        document.getElementById('upload').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const jsonContent = JSON.parse(e.target.result);
                    editor.setValue(jsonContent);
                };
                reader.readAsText(file);
            }
        });
    </script>
</body>
</html>
